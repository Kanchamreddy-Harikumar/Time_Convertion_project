 <!DOCTYPE html>
<html lang="en">
    <head>
        <title>TimeConverter Login</title>
        <meta charset="UTF-8">
        <meta name="author" content="Kanchamreddy Harikumar">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="login.css">
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
        <script src="https://kit.fontawesome.com/b8c1913ede.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div id="sectionHome"> 
            <div class="bg-image">
            <nav class="navcontainer">
                <ul class="unOrderedList">
                    <li><a class="nav-link" href="#" id="Home">Home</a></li>
                    <li><a class="nav-link" href="#" id="FeaturesLink">Features</a></li>
                    <li><a class="nav-link" href="#" id="AboutLink">About</a></li>
                    <li><a class="nav-link" href="#" onclick="display('sectionLoginPage')">Login</a></li> 
                </ul>
            </nav>
            <div class="Imagecontainer" id="imageContainer">
                <h1 class="heading">Welcome To Time Converter...</h1>
                <div class="d-flex flex-row m-5">
                    <div class="ProfileCont" id="Text">
                        <p id="paraText"></p>
                    </div>
                    <div class="ProfileCont_1">
                        <img src="https://res.cloudinary.com/harikumar/image/upload/v1764769998/208784979-generative-ai-end-of-the-time-dilation-stops-are-related-with-time-travel-theory-of-relativity_vwogek.jpg" class="ProfileCont_1 shadow-lg imagePortofile" alt="..." />
                    </div>

                </div>
            </div>
        </div>
        </div>


        <div id="sectionLoginPage">
            <div class="loginPage-Bg">
                <div class="loginPage-Align p-5">
                <div class="signInContainer ml-2">
                    <h1 class="signIn-heading">Welcome Back!</h1>
                    <p class="signIn-heading signIn-para">To keep connected with us please<br> login with your personal info </p>
                    <div class="button-Align">
                        <button class="btn btn-info " id="signIn" onclick="display('sectionSignIn')" >SIGN IN</button>
                        <button class=" btn btn-secondary ml-2" onclick="display('sectionHome')"> Back</button>
                    </div>
                </div>

                <div class="signUpContainer">
                    <h1 class="signUp-heading">Create Account</h1>
                    <div class="d-flex flex-row justify-content-center">
                        <i class=" fa-brands fa-facebook p-2"></i>
                        <i class="fa-brands fa-google-plus p-2"></i>
                        <i class="fa-brands fa-linkedin p-2"></i>
                    </div>
                    <p class="signUp-para">or use your email for registration:</p><br>
                    <div class="text-center">
                        <label class="label" for="Text" >Name:</label>
                        <input class="text mb-2" type="text" id="Text" placeholder="Enter Your name"/> <br>
                        <label class="label" for="Email">Email:</label>
                        <input class="text mb-2" type="email" placeholder="Enter your email" id="Email" /><br>
                        <label class="label" for="Password">Password:</label>
                        <input class="text mb-4" type="password" placeholder="Enter Password" id="Password" /><br>
                    </div>
                    <div class="button-Align">
                        <button class="btn btn-info">SIGN UP</button>
                        <button class=" btn btn-secondary ml-2" onclick="display('sectionHome')"> Back</button>
                </div>
                </div>
            </div>
            </div>
        </div>


        <div id="sectionSignIn">
            <div class="signIn-background d-flex flex-column justify-content-center box">
                <div class="signIn-Align">
                    <h1 class="signin-heading">Welcome Back! <br><span class="span">to your account</span></h1>
                    <br>
                    <form>
                        <input class="text mb-2" type="email" placeholder="Enter your existing email" />
                        <br />
                        <input class="text mb-2" type="password" placeholder="Enter valid Password" />
                        <br>
                        <button class="btn btn-primary box mr-5">LogIn</button>
                        <button class="btn btn-secondary" onclick="display('sectionLoginPage')">Back</button>
                    </form>
                </div>
            </div>

        </div>
            <script type="text/javascript" src="https://new-assets.ccbp.in/frontend/content/static-ccbp-ui-kit/static-ccbp-ui-kit.js"></script>
             <script src="login.js"></script>    
    </body>
</html>
